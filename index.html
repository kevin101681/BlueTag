<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#fdfcff" />
    
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <!-- PWA Install Prompt Capture: Must run before other scripts -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredPrompt = e;
      });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Try to register service worker, but don't fail if it doesn't exist
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful');
            })
            .catch(err => {
              // Silently fail - service worker is optional
              console.debug('ServiceWorker not available:', err.message);
            });
        });
      }
    </script>

    <!-- Anti-flash script: Detect theme preference immediately -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cbs_punch_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // Default to dark if no saved setting
          var shouldBeDark = saved === 'dark' || (!saved) || (saved === 'system' && systemDark);
          if (shouldBeDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#020617');
          }
        } catch (e) {}
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BlueTag" />
    <title>BlueTag</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/images/icon.png" />
    <link rel="icon" href="/images/icon.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #fdfcff;
        /* Default Blue Fallback */
        --color-primary: 96 165 250; 
        --color-primary-container: 219 234 254; 
        --color-on-primary-container: 30 58 138; 
      }
      
      :root.dark {
        --bg-color: #020617;
      }
      body { 
        font-family: 'Google Sans Flex', 'Outfit', sans-serif; 
        background-color: var(--bg-color); 
      }
      
      /* Hide scrollbar globally */
      * {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      *::-webkit-scrollbar {
          display: none; /* Chrome, Safari and Opera */
      }

      /* Material 3 Ripple effect simulation */
      .ripple {
        position: relative;
        overflow: hidden;
      }
      
      /* Force Netlify Identity to be on top of app modals */
      #netlify-modal {
        z-index: 10000 !important;
      }
    </style>
    
    <!-- Load PDF.js from CDN globally to avoid build/module resolution issues -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Configure worker immediately
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
